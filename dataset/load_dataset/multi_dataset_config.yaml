# 多数据集加载配置
# 每个数据集可配置：
#   enabled: 是否启用
#   root: 数据集根目录路径
#   split: 加载哪个分片（空字符串表示全部）
#   max_samples: 最多加载多少条（null 表示不限制）

datasets:
  aishell1:
    enabled: true
    root: /mnt/afs/share/voice_model_project/datasets/AIShell-1
    split: train          # 可选: train / dev / test / ""(全部)
    max_samples: 2000

  aishell3:
    enabled: true
    root: /mnt/afs/share/voice_model_project/datasets/AISHELL-3
    split: train          # 可选: train / test / ""(全部)
    max_samples: 2000

  libritts:
    enabled: false
    root: /mnt/afs/share/voice_model_project/datasets/LibriTTS
    subset: ""            # 可选: train-clean-100 / train-clean-360 / train-other-500 / ""(全部 train 子集)
    max_samples: 2000

  vctk:
    enabled: false
    root: /mnt/afs/share/voice_model_project/datasets/VCTK
    split: train          # 该数据集无正式 split，train 表示使用全部可用样本
    max_samples: 2000

  voiceassistant400k:
    enabled: true
    root: /mnt/afs/share/voice_model_project/datasets/VoiceAssistant-400K
    max_samples: 2000     # 该数据集无 split 概念

  mmsu:
    enabled: true
    root: /mnt/afs/share/voice_model_project/datasets/MMSU
    max_samples: 2000     # null 表示加载全部

  librispeech:
    enabled: false
    root: /mnt/afs/share/voice_model_project/datasets/LibriSpeech
    subset: train-clean-100
    max_samples: 2000

  wenetspeech:
    enabled: false
    root: /mnt/afs/share/voice_model_project/datasets/WenetSpeech
    subset: L
    max_samples: 2000

  fleurs:
    enabled: false
    root: /mnt/afs/share/voice_model_project/datasets/FLEURS
    split: train
    language: en_us
    max_samples: 2000

  commonvoice:
    enabled: false
    root: /mnt/afs/share/voice_model_project/datasets/CommonVoice
    split: train
    language: zh-TW
    max_samples: 2000

  audiocaps:
    enabled: false
    root: /mnt/afs/share/voice_model_project/datasets/AudioCaps
    split: train
    max_samples: 2000

  clotho:
    enabled: false
    root: /mnt/afs/share/voice_model_project/datasets/Clotho
    split: train
    max_samples: 2000

  ultrachat:
    enabled: false
    root: /mnt/afs/share/voice_model_project/datasets/ultrachat
    max_samples: 2000

  spoken_squad:
    enabled: false
    root: /mnt/afs/share/voice_model_project/datasets/Spoken-SQuAD
    split: train
    max_samples: 2000

  musan:
    enabled: false
    root: /mnt/afs/share/voice_model_project/datasets/MUSAN
    split: train
    max_samples: 2000

  openhermes25:
    enabled: false
    root: /mnt/afs/share/voice_model_project/datasets/OpenHermes-2___5
    max_samples: 2000

  tulu3_sft_mixture:
    enabled: false
    root: /mnt/afs/share/voice_model_project/datasets/tulu-3-sft-mixture
    split: train
    subset: ""
    max_samples: 2000

# 输出配置
output:
  shuffle: true           # 合并后是否随机打乱
  seed: 42                # 随机种子（shuffle=true 时生效）
