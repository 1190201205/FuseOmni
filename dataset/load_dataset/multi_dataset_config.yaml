# 多数据集加载配置
# 每个数据集可配置：
#   enabled: 是否启用
#   root: 数据集根目录路径
#   split: 加载哪个分片（空字符串表示全部）
#   max_samples: 最多加载多少条（null 表示不限制）

datasets:
  aishell1:
    enabled: true
    root: /mnt/afs/share/voice_model_project/datasets/AIShell-1
    split: train          # 可选: train / dev / test / ""(全部)
    max_samples: 2000

  aishell3:
    enabled: true
    root: /mnt/afs/share/voice_model_project/datasets/AISHELL-3
    split: train          # 可选: train / test / ""(全部)
    max_samples: 2000

  voiceassistant400k:
    enabled: true
    root: /mnt/afs/share/voice_model_project/datasets/VoiceAssistant-400K
    max_samples: 2000     # 该数据集无 split 概念

  mmsu:
    enabled: true
    root: /mnt/afs/share/voice_model_project/datasets/MMSU
    max_samples: 2000     # null 表示加载全部

# 输出配置
output:
  shuffle: true           # 合并后是否随机打乱
  seed: 42                # 随机种子（shuffle=true 时生效）
